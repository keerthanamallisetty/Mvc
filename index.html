<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java MVC Greeting App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1>Java MVC Application</h1>
        <p>Simple Spring MVC demonstration</p>

        <input id="name" type="text" placeholder="Enter your name">
        <button id="greetButton">Greet Me</button>

        <h2 id="result">Your greeting will appear here</h2>

        <div class="flow">
            <span>View</span>
            <span>→</span>
            <span>Controller</span>
            <span>→</span>
            <span>Model</span>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
