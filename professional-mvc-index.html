<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Management System - MVC</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f8f9fa}
.hero{background:#0d6efd;color:white;padding:40px 0}
.card{border:none;box-shadow:0 2px 10px rgba(0,0,0,.08)}
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Student MVC App</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#register">Register</a></li>
        <li class="nav-item"><a class="nav-link" href="#students">Students</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="hero text-center">
  <div class="container">
    <h1>Student Management System</h1>
    <p>Professional MVC Frontend Template for Java Spring Boot Projects</p>
  </div>
</section>

<div class="container my-5">

  <div class="card p-4 mb-4" id="register">
    <h3 class="mb-3">Student Registration</h3>

    <form id="studentForm">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Student Name</label>
          <input type="text" id="name" class="form-control">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Phone</label>
          <input type="text" id="phone" class="form-control">
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Course</label>
          <input type="text" id="course" class="form-control">
        </div>
      </div>

      <button class="btn btn-primary" type="submit">Add Student</button>
      <div id="message" class="mt-3"></div>
    </form>
  </div>

  <div class="card p-4" id="students">
    <h3 class="mb-3">Student List</h3>

    <div class="table-responsive">
      <table class="table table-bordered table-striped" id="studentTable">
        <thead class="table-dark">
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Course</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
document.getElementById("studentForm").addEventListener("submit", function(e){
  e.preventDefault();

  let name=document.getElementById("name").value.trim();
  let email=document.getElementById("email").value.trim();
  let phone=document.getElementById("phone").value.trim();
  let course=document.getElementById("course").value.trim();
  let message=document.getElementById("message");

  const emailPattern=/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;
  const phonePattern=/^[0-9]{10}$/;

  if(name.length < 3){
    message.innerHTML='<div class="alert alert-danger">Name must contain at least 3 characters.</div>';
    return;
  }

  if(!emailPattern.test(email)){
    message.innerHTML='<div class="alert alert-danger">Enter a valid email address.</div>';
    return;
  }

  if(!phonePattern.test(phone)){
    message.innerHTML='<div class="alert alert-danger">Phone number must contain 10 digits.</div>';
    return;
  }

  if(course === ""){
    message.innerHTML='<div class="alert alert-danger">Course is required.</div>';
    return;
  }

  let row=`<tr>
      <td>${name}</td>
      <td>${email}</td>
      <td>${phone}</td>
      <td>${course}</td>
    </tr>`;

  document.querySelector("#studentTable tbody").insertAdjacentHTML("beforeend", row);

  message.innerHTML='<div class="alert alert-success">Student added successfully.</div>';
  document.getElementById("studentForm").reset();
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
